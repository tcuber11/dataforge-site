<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>DataForge promo</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  Deterministic 1920x1080 animation for the promo video: every visual is a pure function of `t` (seconds).
  scripts/render-promo.mjs loads it with ?capture and calls window.render(t) per frame; opened plainly it loops on a clock.
  ?lang=en switches the copy. Scenes: 0 title · 5 engines · 13 query · 22 review + deploy · 32 AI · 39 end · 45.
  Look: DESIGN.md "The Departure Timetable" in its graphite theme; a change travels a route line.
-->
<style>
:root{
  --ground:#101216;--sheet:#15181d;--raised:#1b1f25;--well:#0c0e11;
  --ink:#eceef1;--ink2:#b8bdc6;--ink3:#8f95a0;--rule:#2a2f37;--head:#d6d9de;
  --blue:#7c97ff;--blue-ink:#0d1020;--dev:#5cc28a;--staging:#e2a94b;--prod:#ff6b5e;
  --sans:Geist,ui-sans-serif,system-ui,sans-serif;--mono:"Geist Mono",ui-monospace,Menlo,monospace;
}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);overflow:hidden;font-feature-settings:"tnum" 1}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--ground)}
.scene{position:absolute;inset:0}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
h1{font-weight:700;font-size:112px;line-height:1.02;letter-spacing:-.035em;margin:0}
h1 em{font-style:normal;color:var(--blue)}
.tag{font-size:34px;color:var(--ink2);margin-top:30px;letter-spacing:-.01em}
.brand{display:flex;align-items:center;gap:22px;font-weight:700;font-size:56px;letter-spacing:-.03em}
.label{font:600 15px var(--sans);letter-spacing:.08em;text-transform:uppercase}
.mark{display:inline-flex;align-items:center;gap:8px}
.mark i{display:inline-block;width:12px;height:12px;border-radius:2px}
.mono{font-family:var(--mono)}

/* route line (top of scenes 1-4) */
#route{position:absolute;left:220px;right:220px;top:62px;height:60px}
#route .track{position:absolute;left:0;right:0;top:14px;height:3px;background:var(--rule)}
#route .fill{position:absolute;left:0;top:14px;height:3px;background:var(--head)}
#route .stop{position:absolute;top:6px;width:19px;height:19px;margin-left:-10px;border-radius:50%;background:var(--ground);border:3px solid var(--rule);box-sizing:border-box}
#route .stop.done{background:var(--head);border-color:var(--head)}
#route .stop.now{background:var(--blue);border-color:var(--blue);box-shadow:0 0 0 8px rgb(124 151 255/.22)}
#route .name{position:absolute;top:36px;transform:translateX(-50%);font:500 18px var(--sans);color:var(--ink3);white-space:nowrap}
#route .name.now{color:var(--ink)}

.cap{position:absolute;left:0;right:0;bottom:78px;text-align:center;font-size:44px;font-weight:600;letter-spacing:-.02em}
.cap small{display:block;margin-top:12px;font-size:25px;font-weight:400;color:var(--ink2);letter-spacing:0}

/* title route */
.envline{position:relative;width:1180px;height:90px;margin-top:64px}
.envline .track{position:absolute;left:0;top:20px;height:4px;background:var(--head)}
.envline .stop{position:absolute;top:10px;width:24px;height:24px;margin-left:-12px;border-radius:50%;border:4px solid var(--head);background:var(--ground);box-sizing:border-box}
.envline .stop.end{border-radius:4px}
.envline .mark{position:absolute;top:50px;transform:translateX(-50%)}

/* engines board */
.board{position:absolute;left:150px;right:150px;top:262px;display:grid;grid-template-columns:repeat(3,1fr);gap:0 60px}
.board .head{display:flex;justify-content:space-between;border-bottom:2px solid var(--head);padding-bottom:10px;margin-bottom:2px;color:var(--ink2)}
.board .row{display:flex;justify-content:space-between;align-items:center;height:47px;border-bottom:1px solid var(--rule)}
.board .row b{font:500 25px var(--mono);letter-spacing:-.01em}
.board .row span{font:500 14px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.board .row span.ok{color:var(--dev)}.board .row span.un{color:var(--staging)}
.count{position:absolute;left:150px;top:150px;display:flex;align-items:baseline;gap:16px;color:var(--ink2);font-size:22px}
.count b{font-size:54px;color:var(--ink);font-weight:700;letter-spacing:-.03em}

/* windows */
.win{position:absolute;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;overflow:hidden;box-shadow:0 30px 80px rgb(0 0 0/.45)}
.bar{display:flex;align-items:center;gap:18px;height:58px;padding:0 22px;border-bottom:2px solid var(--head);font-size:20px;color:var(--ink2)}
.bar .run{display:inline-flex;align-items:center;gap:10px;background:var(--blue);color:var(--blue-ink);font-weight:600;padding:9px 20px;border-radius:6px}
.bar .sp{flex:1}
.nav{position:absolute;left:0;top:60px;bottom:0;width:300px;border-right:1px solid var(--rule);padding:18px 20px;font-size:20px;box-sizing:border-box}
.nav div{height:38px;display:flex;align-items:center;gap:10px;white-space:nowrap}
.nav .t{padding-left:28px;font-family:var(--mono);font-size:18px;color:var(--ink2)}
.editor{position:absolute;left:300px;right:0;top:60px;height:262px;background:var(--raised);padding:20px 0;box-sizing:border-box;font:400 24px/36px var(--mono);white-space:pre}
.editor .ln{display:inline-block;width:70px;text-align:right;padding-right:26px;color:var(--ink3)}
.k{color:var(--blue);font-weight:600}.f{color:#d58cff}.s{color:var(--prod)}.n{color:var(--staging)}
.caret{display:inline-block;width:3px;height:30px;background:var(--blue);vertical-align:-6px}
.grid{position:absolute;left:300px;right:0;top:322px;bottom:0}
.grid .meta{display:flex;justify-content:space-between;height:52px;align-items:center;padding:0 26px;color:var(--ink2);font-size:19px;border-top:1px solid var(--rule)}
.grid table{width:100%;border-collapse:collapse;font:400 21px var(--mono)}
.grid th{font:600 15px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);text-align:left;padding:10px 26px;border-bottom:2px solid var(--head)}
.grid td{padding:0 26px;height:39px;border-bottom:1px solid var(--rule)}
.grid .r{text-align:right}

/* review */
.cr{left:230px;right:230px;top:160px;height:700px;padding:36px 48px;box-sizing:border-box}
.cr h2{margin:0;font-size:42px;letter-spacing:-.02em;font-weight:650}
.stops{position:relative;height:96px;margin-top:34px;border-top:2px solid var(--head)}
.stops .line{position:absolute;top:28px;height:3px;background:var(--rule);left:12px;right:12px}
.stops .lf{position:absolute;top:28px;height:3px;background:var(--head);left:12px}
.stops .st{position:absolute;top:18px;width:23px;height:23px;margin-left:-11px;border-radius:50%;border:3px solid var(--rule);background:var(--sheet);box-sizing:border-box}
.stops .st.sq{border-radius:4px}
.stops .st.done{background:var(--head);border-color:var(--head)}
.stops .st.now{background:var(--blue);border-color:var(--blue);box-shadow:0 0 0 9px rgb(124 151 255/.22)}
.stops .st.work{background:var(--staging);border-color:var(--staging)}
.stops .st.ok{background:var(--dev);border-color:var(--dev);box-shadow:0 0 0 9px rgb(92 194 138/.22)}
.stops .nm{position:absolute;top:54px;font-size:20px;color:var(--ink3);transform:translateX(-11px)}
.stops .nm.now{color:var(--ink);font-weight:600}
.cols{display:grid;grid-template-columns:1.25fr 1fr;gap:44px;margin-top:20px}
.well{background:var(--well);border-radius:6px;padding:22px 26px;font:400 21px/34px var(--mono);white-space:pre;color:var(--ink)}
.hash{margin-top:16px;font:400 18px var(--mono);color:var(--ink3)}
.hash b{color:var(--dev);font-weight:500}
.sect{font-size:24px;font-weight:650;padding-bottom:12px;border-bottom:2px solid var(--head)}
.rev{display:flex;align-items:center;gap:14px;height:56px;border-bottom:1px solid var(--rule);font-size:21px}
.rev .ck{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--dev);color:var(--ground);font-weight:700;font-size:17px}
.rev small{color:var(--ink3);font-size:18px}
.confirm{margin-top:26px;border:1px solid var(--rule);border-top:3px solid var(--prod);border-radius:6px;padding:18px 20px;font-size:20px;color:var(--ink2)}
.confirm .in{margin-top:12px;display:flex;gap:12px}
.confirm .box{flex:1;height:48px;border:1px solid var(--rule);background:var(--raised);border-radius:6px;font:400 21px/48px var(--mono);padding:0 14px;color:var(--ink)}
.confirm .dep{height:50px;padding:0 24px;border-radius:6px;background:var(--prod);color:#fff;font-weight:600;display:grid;place-items:center}
.status{font:600 15px var(--sans);letter-spacing:.08em;text-transform:uppercase}

/* AI */
.ai{left:330px;right:330px;top:160px;height:700px;padding:34px 44px;box-sizing:border-box}
.ask{display:flex;align-items:center;gap:16px;height:72px;border:1px solid var(--rule);background:var(--raised);border-radius:8px;padding:0 22px;font-size:26px}
.ask svg{flex:none}
.draft{position:relative;margin-top:24px;min-height:238px}
.draft .tagd{position:absolute;right:16px;top:14px;color:var(--staging);border:1px solid var(--staging);border-radius:4px;padding:3px 9px}
.btns{display:flex;gap:14px;margin-top:20px}
.btns span{height:50px;padding:0 22px;border-radius:6px;display:grid;place-items:center;font-size:20px;border:1px solid var(--rule);background:var(--raised)}
.btns span.p{background:var(--blue);color:var(--blue-ink);border-color:var(--blue);font-weight:600}
.term{margin-top:26px;background:#000;border-radius:8px;padding:18px 22px;font:400 21px/34px var(--mono);color:var(--ink2);min-height:72px}
.term b{color:var(--dev);font-weight:500}

/* end */
.checks{display:flex;gap:56px;margin-top:44px;font-size:27px;color:var(--ink2)}
.checks span{display:inline-flex;align-items:center;gap:14px}
.checks span::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--dev)}
.cta{display:inline-flex;align-items:center;gap:14px;background:var(--blue);color:var(--blue-ink);border-radius:8px;padding:22px 48px;font-size:32px;font-weight:600;margin-top:50px}
.url{margin-top:28px;font:500 28px var(--mono);color:var(--ink2)}
</style>
</head>
<body>
<div id="stage">
  <svg width="0" height="0" style="position:absolute"><defs>
    <symbol id="logo" viewBox="0 0 24 24"><rect width="24" height="24" rx="5.5" fill="#1b1f25" stroke="#2a2f37" stroke-width=".5"/><path d="M7 5.5h4.5a6.5 6.5 0 0 1 0 13H7z" fill="none" stroke="#fff" stroke-width="2.25" stroke-linejoin="round"/><path d="M10 10.25h4.25M10 13.75h4.25" stroke="#fff" stroke-width="1.25" stroke-linecap="round" opacity=".55"/><rect x="4.75" y="10.25" width="4.5" height="3.5" rx="1" fill="#7c97ff"/></symbol>
    <symbol id="spark" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z" fill="none" stroke="#7c97ff" stroke-width="1.8" stroke-linejoin="round"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z" fill="#7c97ff"/></symbol>
  </defs></svg>

  <!-- 0: title -->
  <div class="scene center" id="s0">
    <div class="brand"><svg width="84" height="84"><use href="#logo"/></svg>DataForge</div>
    <h1 style="margin-top:44px" data-t="title"></h1>
    <p class="tag" data-t="titleSub"></p>
    <div class="envline" id="envline">
      <div class="track" id="envtrack"></div>
      <div class="stop" style="left:0"></div><div class="stop" style="left:50%"></div><div class="stop end" style="left:100%"></div>
      <div class="mark label" style="left:0;color:var(--ink2)"><i style="background:var(--dev)"></i>Dev</div>
      <div class="mark label" style="left:50%;color:var(--ink2)"><i style="background:var(--staging)"></i>Staging</div>
      <div class="mark label" style="left:100%;color:var(--prod)"><i style="background:var(--prod)"></i>Prod</div>
    </div>
  </div>

  <!-- route line shared by scenes 1-4 -->
  <div id="route"><div class="track"></div><div class="fill" id="rfill"></div></div>

  <!-- 1: engines -->
  <div class="scene" id="s1">
    <div class="count"><b id="cnt">0</b><span data-t="engCount"></span></div>
    <div class="board" id="board"></div>
  </div>

  <!-- 2: query -->
  <div class="scene" id="s2">
    <div class="win" style="left:150px;right:150px;top:160px;height:700px">
      <div class="bar"><span class="run" id="runbtn">▶ Run</span><span>Script</span><span>Plan</span><span class="sp"></span><span class="mark label"><i style="background:var(--dev)"></i>Dev</span><span class="mono" style="color:var(--ink)">shop</span></div>
      <div class="nav"><div><b>shop</b><span class="mark label" style="margin-left:auto;font-size:13px;color:var(--ink2)"><i style="background:var(--dev)"></i>Dev</span></div><div style="color:var(--ink3);padding-left:14px">public</div><div class="t">customers</div><div class="t">orders</div><div style="color:var(--ink3);padding-left:14px" data-t="views"></div></div>
      <div class="editor" id="ed"></div>
      <div class="grid" id="grid"></div>
    </div>
  </div>

  <!-- 3: review + deploy -->
  <div class="scene" id="s3">
    <div class="win cr">
      <div style="display:flex;align-items:baseline;justify-content:space-between"><h2>Add loyalty tier to customers</h2><span class="mark label" style="color:var(--prod)"><i style="background:var(--prod)"></i>Prod <span class="mono" style="color:var(--ink2);text-transform:none;letter-spacing:0;font-size:18px;margin-left:8px">shop-prod</span></span></div>
      <div class="stops" id="stops"></div>
      <div class="cols">
        <div>
          <div class="well">ALTER TABLE customers
  ADD COLUMN loyalty_tier text
  NOT NULL DEFAULT 'bronze';

CREATE INDEX customers_tier_idx
  ON customers (loyalty_tier);</div>
          <div class="hash" id="hash"></div>
        </div>
        <div>
          <div class="sect" id="revhead"></div>
          <div id="revs"></div>
          <div class="confirm" id="confirm"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 4: AI -->
  <div class="scene" id="s4">
    <div class="win ai">
      <div class="ask"><svg width="34" height="34"><use href="#spark"/></svg><span id="q"></span></div>
      <div class="well draft" id="draft"></div>
      <div class="btns" id="aibtns"><span class="p" data-t="apply"></span><span data-t="toCR"></span></div>
      <div class="term" id="term"></div>
    </div>
  </div>

  <!-- 5: end -->
  <div class="scene center" id="s5">
    <div class="brand"><svg width="84" height="84"><use href="#logo"/></svg>DataForge</div>
    <h1 style="margin-top:40px;font-size:92px" data-t="endH"></h1>
    <div class="checks" id="checks"></div>
    <div class="cta" data-t="endCta"></div>
    <p class="url" id="url"></p>
  </div>

  <div class="cap" id="cap"></div>
</div>

<script>
// The site's address for the closing card; empty hides the line.
const SITE_URL = "";
const LANG = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "id";
const T = {
  id: {
    title: "Query cepat.<br>Ubah dengan <em>aman</em>.",
    titleSub: "Database client, review perubahan, dan asisten AI dalam satu workspace.",
    stops: ["Hubungkan", "Query", "Review", "Deploy", "AI"],
    engCount: "engine · 28 teruji di container sungguhan",
    tested: "teruji", untested: "belum teruji",
    cap1: "Semua database kamu, satu navigator.", sub1: "SQL, NoSQL, graph, vector, message queue: PostgreSQL sampai Kafka.",
    views: "views",
    cap2: "Query dengan akun read-only.", sub2: "Setiap statement diparse dengan grammar engine-nya sendiri sebelum jalan.",
    rows: "50 baris · 14 ms · akun read-only", running: "Menjalankan…",
    cap3: "Perubahan ke prod butuh dua reviewer.", sub3: "Yang di-deploy persis byte yang di-approve, dan semuanya tercatat di audit log.",
    stopNames: ["Draft", "In review", "Approved", "Deployed"],
    reviews: (n) => `Approval ${n} dari 2`, approved: "menyetujui v1",
    confirm: "Ketik nama koneksi untuk deploy", deploy: "Deploy",
    hashOk: "= versi yang disetujui",
    q: "Lima kota dengan revenue tertinggi, tanpa order yang dibatalkan",
    apply: "Pakai di editor", toCR: "Jadikan change request",
    cap4: "AI menulis draf. Kamu yang memutuskan.", sub4: "Claude, OpenAI-compatible, Gemini atau Ollama, atau sambungkan Claude Code lewat MCP.",
    endH: "Satu workspace untuk<br><em>setiap database.</em>",
    checks: ["App macOS", "Server untuk tim", "15 bahasa"],
    endCta: "Unduh untuk macOS",
  },
  en: {
    title: "Query fast.<br>Change <em>safely</em>.",
    titleSub: "A database client, change reviews and an AI assistant in one workspace.",
    stops: ["Connect", "Query", "Review", "Deploy", "AI"],
    engCount: "engines · 28 tested against real containers",
    tested: "tested", untested: "untested",
    cap1: "All your databases, one navigator.", sub1: "SQL, NoSQL, graph, vector, message queues: PostgreSQL to Kafka.",
    views: "views",
    cap2: "Queries run on a read-only account.", sub2: "Every statement is parsed by the engine's own grammar before it runs.",
    rows: "50 rows · 14 ms · read-only account", running: "Running…",
    cap3: "Changes to prod need two reviewers.", sub3: "Deploys run the exact bytes that were approved, and every step lands in the audit log.",
    stopNames: ["Draft", "In review", "Approved", "Deployed"],
    reviews: (n) => `${n} of 2 approvals`, approved: "approved v1",
    confirm: "Type the connection name to deploy", deploy: "Deploy",
    hashOk: "= the approved version",
    q: "Top five cities by revenue, leaving out cancelled orders",
    apply: "Apply to editor", toCR: "Create change request",
    cap4: "The AI writes a draft. You decide.", sub4: "Claude, OpenAI-compatible, Gemini or Ollama, or connect Claude Code over MCP.",
    endH: "One workspace for<br><em>every database.</em>",
    checks: ["macOS app", "Server for your team", "15 languages"],
    endCta: "Download for macOS",
  },
}[LANG];
document.documentElement.lang = LANG;
document.querySelectorAll("[data-t]").forEach((el) => (el.innerHTML = T[el.dataset.t]));
document.getElementById("checks").innerHTML = T.checks.map((c) => `<span>${c}</span>`).join("");
document.getElementById("url").textContent = SITE_URL;

const $ = (id) => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
const seg = (t, a, b) => clamp((t - a) / (b - a));
const fade = (t, a, b, c, d) => Math.min(seg(t, a, b), 1 - seg(t, c, d));
const lerp = (a, b, x) => a + (b - a) * x;
const show = (id, on) => ($(id).style.display = on ? "" : "none");

// ---- engines (scene 1): name, category, tested
const ENGINES = [
  ["PostgreSQL", "relational", 1], ["MySQL", "relational", 1], ["MariaDB", "relational", 1], ["SQL Server", "relational", 1], ["Oracle", "relational", 1],
  ["CockroachDB", "relational", 1], ["YugabyteDB", "relational", 1], ["TiDB", "relational", 1], ["Cloud Spanner", "relational", 1], ["Dolt", "relational", 1],
  ["ClickHouse", "analytics", 1], ["BigQuery", "analytics", 1], ["Trino", "analytics", 1], ["TimescaleDB", "time series", 1], ["InfluxDB 2", "time series", 1],
  ["SQLite", "file", 1], ["DuckDB", "file", 1], ["Redis", "cache", 1], ["MongoDB", "documents", 1], ["Elasticsearch", "search", 1],
  ["Neo4j", "graph", 1], ["Qdrant", "vector", 1], ["Kafka", "queue", 1], ["RabbitMQ", "queue", 1], ["etcd", "config", 1],
  ["Consul", "config", 1], ["Snowflake", "analytics", 0], ["Redshift", "analytics", 0], ["Databricks", "analytics", 0], ["Supabase", "relational", 0],
];
const board = $("board");
board.innerHTML = [0, 1, 2].map((c) => `<div><div class="head label"><span>Engine</span><span>Status</span></div>${ENGINES.slice(c * 10, c * 10 + 10).map((e, i) => `<div class="row" id="eg${c * 10 + i}"><b></b><span></span></div>`).join("")}</div>`).join("");
const GLYPHS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
const hash = (a, b, c) => Math.abs(Math.sin(a * 12.9898 + b * 78.233 + c * 37.719) * 43758.5453) % 1;
function flap(name, k, i, t) {
  // split-flap: settled characters from the left, the rest still flipping
  const n = Math.floor(name.length * k);
  const f = Math.floor(t * 30);
  let s = name.slice(0, n);
  for (let j = n; j < name.length; j++) s += name[j] === " " ? " " : GLYPHS[Math.floor(hash(i, j, f) * GLYPHS.length)];
  return s;
}

// ---- query (scene 2)
const SQL = "SELECT c.name, c.city,\n       count(o.id)  AS orders,\n       sum(o.total) AS revenue\nFROM customers c JOIN orders o ON o.customer_id = c.id\nWHERE o.status <> 'cancelled'\nGROUP BY 1, 2 ORDER BY revenue DESC LIMIT 50;";
const AI_SQL = "SELECT c.city, sum(o.total) AS revenue\nFROM orders o\nJOIN customers c ON c.id = o.customer_id\nWHERE o.status <> 'cancelled'\nGROUP BY c.city\nORDER BY revenue DESC\nLIMIT 5;";
const KW = new Set("SELECT FROM JOIN ON WHERE GROUP BY ORDER DESC LIMIT AS AND".split(" "));
function hl(src) {
  return src.replace(/'[^']*'?|\b\w+\b|[^\w']+/g, (w) => {
    if (w[0] === "'") return `<span class="s">${w}</span>`;
    if (KW.has(w)) return `<span class="k">${w}</span>`;
    if (/^(count|sum)$/.test(w)) return `<span class="f">${w}</span>`;
    if (/^\d+$/.test(w)) return `<span class="n">${w}</span>`;
    return w.replace(/</g, "&lt;").replace(/>/g, "&gt;");
  });
}
const lines = (src, caret) => src.split("\n").map((l, i, a) => `<span class="ln">${i + 1}</span>${hl(l)}${caret && i === a.length - 1 ? '<span class="caret"></span>' : ""}`).join("\n");
// the first rows the real query returns on the sample shop database
const ROWS = [["Customer 9", "Denpasar", 5, "3704.93"], ["Customer 109", "Denpasar", 5, "3670.31"], ["Customer 95", "Jakarta", 5, "3380.31"], ["Customer 85", "Jakarta", 5, "3257.73"], ["Customer 35", "Jakarta", 5, "3186.61"], ["Customer 117", "Surabaya", 5, "3143.75"]];

const STOP_T = [5, 13, 22, 28.5, 32]; // route stops light up as each scene starts

function render(t) {
  // ---- scene visibility
  const v0 = fade(t, 0.2, 1.2, 4.3, 5.0);
  $("s0").style.opacity = v0; show("s0", t < 5.1);
  $("s0").style.transform = `translateY(${lerp(18, 0, ease(seg(t, 0.2, 1.5)))}px)`;
  $("envtrack").style.width = `${100 * ease(seg(t, 1.4, 3.4))}%`;
  const scenes = [["s1", 5, 13], ["s2", 13, 22], ["s3", 22, 32], ["s4", 32, 39]];
  for (const [id, a, b] of scenes) {
    $(id).style.opacity = fade(t, a, a + 0.7, b - 0.6, b);
    show(id, t > a - 0.05 && t < b + 0.05);
  }
  const v5 = fade(t, 39.3, 40.4, 44.3, 45);
  $("s5").style.opacity = v5; show("s5", t > 39.2);
  $("s5").style.transform = `scale(${lerp(0.965, 1, ease(seg(t, 39.3, 41)))})`;

  // ---- route line
  const rv = fade(t, 5, 5.8, 38.5, 39.2);
  $("route").style.opacity = rv; show("route", rv > 0);
  const W = 1480;
  const pos = (i) => (W * i) / (STOP_T.length - 1);
  let cur = -1;
  STOP_T.forEach((s, i) => { if (t >= s) cur = i; });
  // the ink fills up to the current stop, sliding in as each scene starts
  $("rfill").style.width = `${cur <= 0 ? 0 : lerp(pos(cur - 1), pos(cur), ease(seg(t, STOP_T[cur], STOP_T[cur] + 0.8)))}px`;
  $("route").querySelectorAll(".stop,.name").forEach((e) => e.remove());
  STOP_T.forEach((s, i) => {
    const cls = i < cur ? "done" : i === cur ? "now" : "";
    $("route").insertAdjacentHTML("beforeend", `<div class="stop ${cls}" style="left:${pos(i)}px"></div><div class="name ${i === cur ? "now" : ""}" style="left:${pos(i)}px">${T.stops[i]}</div>`);
  });

  let cap = "", sub = "", capIn = 0;

  // ---- scene 1: engines
  if (t > 4.9 && t < 13.1) {
    cap = T.cap1; sub = T.sub1; capIn = fade(t, 6, 6.8, 12.2, 12.9);
    $("cnt").textContent = Math.round(50 * ease(seg(t, 5.6, 8.6)));
    ENGINES.forEach(([name, cat, ok], i) => {
      const a = 5.6 + (i % 10) * 0.11 + Math.floor(i / 10) * 0.35;
      const k = seg(t, a, a + 0.55);
      const el = $("eg" + i);
      el.style.opacity = seg(t, a - 0.1, a + 0.1);
      el.children[0].textContent = k <= 0 ? "" : flap(name, k, i, t);
      el.children[1].className = k >= 1 ? (ok ? "ok" : "un") : "";
      el.children[1].textContent = k >= 1 ? (ok ? T.tested : T.untested) : cat;
    });
  }

  // ---- scene 2: query
  if (t > 12.9 && t < 22.1) {
    cap = T.cap2; sub = T.sub2; capIn = fade(t, 14, 14.8, 21.2, 21.9);
    const n = Math.round(SQL.length * seg(t, 13.6, 16.8));
    $("ed").innerHTML = lines(SQL.slice(0, n), t < 17.3);
    const press = t > 17.2 && t < 17.5;
    $("runbtn").style.transform = `scale(${press ? 0.94 : 1})`;
    $("runbtn").style.boxShadow = press ? "0 0 0 8px rgb(124 151 255/.25)" : "none";
    const g = $("grid");
    if (t < 17.3) g.innerHTML = "";
    else if (t < 17.8) g.innerHTML = `<div class="meta"><span>${T.running}</span></div>`;
    else {
      const shown = ROWS.filter((_, i) => t > 17.8 + i * 0.07);
      g.innerHTML = `<div class="meta"><span>${T.rows}</span><span class="mono" style="color:var(--ink3)">public</span></div><table><tr><th>name</th><th>city</th><th class="r">orders</th><th class="r">revenue</th></tr>${shown.map((r) => `<tr><td>${r[0]}</td><td>${r[1]}</td><td class="r">${r[2]}</td><td class="r">${r[3]}</td></tr>`).join("")}</table>`;
    }
  }

  // ---- scene 3: review + deploy
  if (t > 21.9 && t < 32.1) {
    capIn = fade(t, 22.8, 23.6, 31.2, 31.9);
    cap = T.cap3; sub = T.sub3;
    // stage: 0 draft, 1 in review, 2 approved, 3 deploying, 4 deployed
    const stage = t < 23.4 ? 0 : t < 27.2 ? 1 : t < 29.7 ? 2 : t < 30.6 ? 3 : 4;
    const X = [0, 33.3, 66.6, 100];
    const pct = stage >= 3 ? 100 : X[stage];
    $("stops").innerHTML = `<div class="line"></div><div class="lf" style="width:calc(${pct}% - ${pct ? 24 : 0}px)"></div>` + X.map((x, i) => {
      let c = "";
      if (i < Math.min(stage, 3)) c = "done";
      if (i === Math.min(stage, 3)) c = "now";
      if (i === 3 && stage === 3) c = "work";
      if (i === 3 && stage === 4) c = "ok";
      return `<div class="st ${i === 3 ? "sq" : ""} ${c}" style="left:calc(12px + (100% - 24px) * ${x / 100})"></div><div class="nm ${i === Math.min(stage, 3) ? "now" : ""}" style="left:calc(12px + (100% - 24px) * ${x / 100});${i === 3 ? "transform:translateX(-85%)" : ""}">${T.stopNames[i]}</div>`;
    }).join("");
    const na = t < 25 ? 0 : t < 26.3 ? 1 : 2;
    $("revhead").textContent = T.reviews(na);
    $("revs").innerHTML = [["Rina", "dba", 25], ["Dimas", "owner", 26.3]].filter((r) => t > r[2]).map((r) => `<div class="rev" style="opacity:${seg(t, r[2], r[2] + 0.3)}"><span class="ck">✓</span><b>${r[0]}</b><small>${r[1]} · ${T.approved}</small></div>`).join("");
    const typed = "shop-prod".slice(0, Math.round(9 * seg(t, 28, 29)));
    const depPress = t > 29.4 && t < 29.7;
    $("confirm").style.opacity = seg(t, 27.4, 27.9);
    $("confirm").innerHTML = `${T.confirm}<div class="in"><div class="box">${typed}${t < 29.4 ? '<span class="caret" style="height:24px;vertical-align:-4px"></span>' : ""}</div><div class="dep" style="transform:scale(${depPress ? 0.94 : 1})">${stage === 3 ? "…" : stage === 4 ? "✓" : T.deploy}</div></div>`;
    $("hash").innerHTML = `sha256 3583c48e5d17…16365ec9e004<br><b style="opacity:${stage === 4 ? 1 : 0}">${T.hashOk}</b>`;
  }

  // ---- scene 4: AI
  if (t > 31.9 && t < 39.1) {
    cap = T.cap4; sub = T.sub4; capIn = fade(t, 32.8, 33.6, 38.3, 38.9);
    $("q").textContent = T.q.slice(0, Math.round(T.q.length * seg(t, 32.5, 34)));
    const n = Math.round(AI_SQL.length * seg(t, 34.5, 36));
    $("draft").innerHTML = (t > 34.3 ? '<span class="tagd label">Draft</span>' : "") + (n ? lines(AI_SQL.slice(0, n), false).replace(/<span class="ln">\d+<\/span>/g, "") : "");
    $("aibtns").style.opacity = seg(t, 36.1, 36.5);
    const cmd = "dataforge mcp install claude-code";
    const c = cmd.slice(0, Math.round(cmd.length * seg(t, 36.6, 37.6)));
    $("term").style.opacity = seg(t, 36.4, 36.7);
    $("term").innerHTML = `$ ${c}${t > 37.9 ? `\n<b>✔</b> Added "dataforge" to Claude Code (user scope).` : ""}`.replace(/\n/g, "<br>");
  }

  const capEl = $("cap");
  capEl.style.opacity = capIn;
  capEl.style.transform = `translateY(${lerp(10, 0, capIn)}px)`;
  capEl.innerHTML = cap ? `${cap}<small>${sub}</small>` : "";
}
window.render = render;

if (new URLSearchParams(location.search).has("capture")) {
  document.fonts.ready.then(() => { render(0); document.body.dataset.ready = "1"; });
} else {
  const start = performance.now();
  const loop = () => { render(((performance.now() - start) / 1000) % 45); requestAnimationFrame(loop); };
  document.fonts.ready.then(loop);
}
</script>
</body>
</html>
